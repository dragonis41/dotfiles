---
# ==============================================================================
# 1. MAINTENANCE APT + FSTRIM ON ALL VMs
# ==============================================================================
- name: Global system update (apt + fstrim)
  hosts: all_vms
  become: yes
  environment:
    DEBIAN_FRONTEND: noninteractive
  tasks:
    - name: apt update and upgrade
      apt:
        update_cache: yes
        upgrade: yes
        dpkg_options: 'force-confdef,force-confold'
      register: apt_res

    - name: show upgraded apt packages
      debug:
        var: apt_res.stdout_lines
      when: apt_res.changed

    - name: apt autoremove --purge
      apt:
        autoremove: yes
        purge: yes

    - name: cleaning apt cache
      command: apt-get clean
      changed_when: false

    - name: fstrim -av
      command: fstrim -av
      register: fstrim_out
      changed_when: false

# ==============================================================================
# 2. STANDARD DOCKER COMPOSE STACK
# ==============================================================================
- name: Update docker images with docker compose
  hosts: docker_compose_standard
  tasks:
    - name: pull and recreate with remove-orphans (compose file in ~/)
      community.docker.docker_compose_v2:
        project_src: "{{ ansible_facts['env']['HOME'] }}"
        pull: always
        state: present
        remove_orphans: yes
      register: compose_res
      retries: 3
      delay: 5
      until: compose_res is not failed

    - name: show updated containers
      debug:
        var: compose_res.actions
      when: compose_res.changed

    - name: pruning old images, volumes and networks
      command: docker system prune -f
      register: prune_res
      changed_when: "'Total reclaimed space: 0B' not in prune_res.stdout"

    - name: show reclaimed docker space
      debug:
        msg: "{{ prune_res.stdout_lines[-1] }}"
      when: prune_res.changed

# ==============================================================================
# 3. SPECIAL CASE : LAB-SATISFACTORY
# ==============================================================================
- name: Update Satisfactory with docker compose
  hosts: lab-satisfactory
  tasks:
    - name: pull latest image
      community.docker.docker_compose_v2_pull:
        project_src: "{{ ansible_facts['env']['HOME'] }}"
      register: sat_pull
      retries: 3
      delay: 5
      until: sat_pull is not failed

    - name: clean stop of the server
      command: docker compose stop
      args:
        chdir: "{{ ansible_facts['env']['HOME'] }}"
      when: sat_pull.changed

    - name: start again with remove-orphans
      command: docker compose up -d --remove-orphans
      args:
        chdir: "{{ ansible_facts['env']['HOME'] }}"
      when: sat_pull.changed

    - name: pruning old images, volumes and networks
      command: docker system prune -f
      register: prune_res
      changed_when: "'Total reclaimed space: 0B' not in prune_res.stdout"

    - name: show reclaimed docker space
      debug:
        msg: "{{ prune_res.stdout_lines[-1] }}"
      when: prune_res.changed

# ==============================================================================
# 4. SPECIAL CASE : LAB-TRACKER (autonomous container)
# ==============================================================================
- name: Update Traccar container
  hosts: lab-tracker
  tasks:
    - name: pull traccar/traccar:latest
      community.docker.docker_image:
        name: traccar/traccar:latest
        source: pull
        force_source: yes
      register: traccar_pull
      retries: 3
      delay: 5
      until: traccar_pull is not failed

    - name: restarting Traccar container
      community.docker.docker_container:
        name: traccar
        state: started
        restart: yes
      when: traccar_pull.changed

    - name: pruning old images, volumes and networks
      command: docker system prune -f
      register: prune_res
      changed_when: "'Total reclaimed space: 0B' not in prune_res.stdout"

    - name: show reclaimed docker space
      debug:
        msg: "{{ prune_res.stdout_lines[-1] }}"
      when: prune_res.changed

# ==============================================================================
# 5. SPECIAL CASE : LAB-DISCORD-BOTS (2 Git + build)
# ==============================================================================
- name: Update discord bots
  hosts: lab-discord-bots
  tasks:
    - name: Git pull and build for discord-bot-ovh-email
      shell: |
        git fetch --all
        OUT=$(git pull)
        echo "$OUT"
        if [[ "$OUT" != *"Already up to date."* ]]; then
          docker compose up -d --build
        fi
      args:
        chdir: "{{ ansible_facts['env']['HOME'] }}/discord-bot-ovh-email"
        executable: /bin/bash
      register: bot1_res
      changed_when: "'Already up to date.' not in bot1_res.stdout"

    - name: Git pull and build for discord-bot-moderation
      shell: |
        git fetch --all
        OUT=$(git pull)
        echo "$OUT"
        if [[ "$OUT" != *"Already up to date."* ]]; then
          docker compose up -d --build
        fi
      args:
        chdir: "{{ ansible_facts['env']['HOME'] }}/discord-bot-moderation"
        executable: /bin/bash
      register: bot2_res
      changed_when: "'Already up to date.' not in bot2_res.stdout"

    - name: pruning old images, volumes and networks
      command: docker system prune -f
      register: prune_res
      changed_when: "'Total reclaimed space: 0B' not in prune_res.stdout"

    - name: show reclaimed docker space
      debug:
        msg: "{{ prune_res.stdout_lines[-1] }}"
      when: prune_res.changed

# ==============================================================================
# 6. UPDATE LAZYDOCKER
# ==============================================================================
- name: Update Lazydocker
  hosts: lazydocker_hosts
  tasks:
    - name: Download and install Lazydocker
      shell: curl -s https://raw.githubusercontent.com/jesseduffield/lazydocker/master/scripts/install_update_linux.sh | bash
      args:
        executable: /bin/bash
      changed_when: false

    - name: Move the binary to /usr/bin/lazydocker
      become: yes
      copy:
        src: "{{ ansible_facts['env']['HOME'] }}/.local/bin/lazydocker"
        dest: /usr/bin/lazydocker
        mode: '0755'
        remote_src: yes
